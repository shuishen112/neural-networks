name: Execute notebooks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install nbconvert ipykernel

      - name: Notebooks are in sync with src/
        run: python build.py --check

      - name: Execute lectures and solutions
        run: |
          mkdir -p executed
          failed=()
          timings=""
          for nb in lectures/*.ipynb solutions/*.ipynb language_models/*.ipynb; do
            echo "::group::$nb"
            start=$(date +%s)
            if jupyter nbconvert --to notebook --execute "$nb" \
                 --ExecutePreprocessor.timeout=1200 \
                 --output-dir executed/$(dirname "$nb") 2> err.txt; then
              secs=$(( $(date +%s) - start ))
              echo "OK  $nb  (${secs}s)"
              timings="$timings $(basename "$nb" .ipynb)=${secs}s"
            else
              cat err.txt
              # Put the end of the traceback in the annotation so it is visible via the API.
              msg=$(grep -v '^\s*$' err.txt | tail -n 25 | cut -c1-300 | sed 's/%/%25/g' | tr '\n' '|' )
              echo "::error file=$nb::${msg}"
              failed+=("$nb")
            fi
            echo "::endgroup::"
          done
          echo "::notice title=Notebook timings::${timings}"
          if [ ${#failed[@]} -ne 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed/
